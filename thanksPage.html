<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Flex</title>

    <link rel="shortcut icon" href="images/checked.png" type="image/x-icon" />

    <template id="pixel-container">
      <!-- 
           حط كود البيكسل هنا      تحت الكومنت(Script tags & Noscript tags)
          مثال لتيك توك أو فيسبوك:  <script> ... </script>-->











    </template>

    <style>
      @font-face {
        font-family: F_Bold;
        src: local("F_Bold"), url("css/BOLD.TTF");
      }
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
        direction: rtl;
      }
      body,
      html {
        font-family: F_Bold, sans-serif;
      }
      a {
        text-decoration: none;
      }
      img {
        width: 100%;
        display: block;
      }
      .div_btn {
        text-align: center;
      }
      .div_btn .btn {
        font-family: F_Bold, sans-serif;
        font-size: 24px;
        padding: 1px 38px 5px;
        line-height: 1.5;
        color: #fff;
        border-radius: 20px;
        box-shadow: 0 5px 15px #5858586b;
        cursor: pointer;
        line-height: 1;
      }
      .div_btn .btn span {
        color: #d5d5d5;
      }

      /* Start Thanks Page Section */
      body.thanks_page_page {
        background: url(images/thanks-2.webp) center/cover;
        min-height: 100vh;
      }
      .thanks_page {
        text-align: center;
        padding-top: 30px;
      }
      .thanks_page h3 {
        font-size: 22px;
        color: #fcfefe;
        background: linear-gradient(  #3141D7, #90F3FB);
        width: max-content;
        margin: 0 auto;
        border-radius: 10px;
        padding: 0px 11px 2px;
        text-align: center;
      }
      .thanks_page p {
        font-size: 15px;
        color: #fcfefe;
   background: linear-gradient(#F2CC4F, #E04B38);
        width: max-content;
        margin: 0 auto 15px;
        padding: 1px 8px 3px;
        border-radius: 10px;
      }
      .thanks_page .text {
        position: relative;
        width: max-content;
        margin: 0 auto;
      }
      .thanks_page .div_btn {
        margin-top: 30px;
      }
      .thanks_page .div_btn a {
        background: linear-gradient(10deg,#F7AA1F,#F5601A );
      }
      .thanks_page .text .img_check {
        width: 80px;
        text-align: center;
        margin: 0 auto 15px;
      }
      /* ==========  Responsive Design  ========== */
      @media (min-width: 600px) {
        body.thanks_page_page {
          background: #313131;
          min-height: 100vh;
        }
      }

      @media (min-width: 992px) {
        .thanks_page p {
          font-size: 18px;
          margin-bottom: 25px;
        }

        .thanks_page h3 {
          font-size: 25px;
          margin: 0px auto 8px;
        }

        .thanks_page .text img {
          width: 100px;
        }
      }
    </style>
  </head>

  <body class="thanks_page_page">
    <div class="thanks_page">
      <div class="text">
        <img class="img_check" src="images/checked.png" alt="" />
        <h3>تم تسجيل طلبكم للمنتج بنجاح</h3>
        <p>سيقوم احد ممثلي خدمة العملاء بالتواصل معك</p>
      </div>
      <div class="div_btn">
        <a href="index.html" class="btn">الرجوع للموقع</a>
      </div>
    </div>

    <!-- كود تفعيل حاوية البيكسل المشروط -->
    <script>
      (function () {
        "use strict";
        try {
          var auth = sessionStorage.getItem("wg_px_auth");
          // مسح التصريح فوراً لمنع التكرار نهائياً عند عمل Refresh للصفحة
          sessionStorage.removeItem("wg_px_auth");

          if (!auth) return;

          var parts = auth.split(".");
          if (parts.length !== 2) return;

          var ts = parseInt(parts[0], 10);
          var now = Math.floor(Date.now() / 1000);

          // التحقق من صلاحية التصريح الزمنية (أقل من دقيقتين) وطول التوقيع
          if (!ts || Math.abs(now - ts) > 120 || parts[1].length !== 64) {
            return;
          }

          var tmpl = document.getElementById("pixel-container");
          if (!tmpl) return;

          var content = tmpl.innerHTML;
          if (!content || !content.trim()) return;

          var tempDiv = document.createElement("div");
          tempDiv.style.display = "none";
          tempDiv.innerHTML = content;

          var scripts = tempDiv.getElementsByTagName("script");
          var scriptsArr = Array.prototype.slice.call(scripts);

          scriptsArr.forEach(function (oldScript) {
            var newScript = document.createElement("script");
            for (var i = 0; i < oldScript.attributes.length; i++) {
              newScript.setAttribute(
                oldScript.attributes[i].name,
                oldScript.attributes[i].value
              );
            }
            newScript.text = oldScript.innerHTML;
            document.head.appendChild(newScript);
            oldScript.parentNode.removeChild(oldScript);
          });

          if (tempDiv.childNodes.length > 0) {
            document.body.appendChild(tempDiv);
          }
        } catch (e) {
          console.error("Pixel activation error:", e);
        }
      })();
    </script>
  </body>
</html>
